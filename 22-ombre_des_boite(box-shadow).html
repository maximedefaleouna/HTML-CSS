<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>les ombre des boites</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            margin: 100px;
        }
        .div1{
            background-color: #9a031e ;
            box-shadow: 20px 20px 20px red;

        }
        .div2{
            background-color: #ae556b ;
            box-shadow: 20px 20px teal;
        }
        .div3{
            background-color: #ffd166;
            box-shadow:  0px 0px 30px inset  black;
        }
    </style>
</head>
<body>
    <h1>
        <mark>ombre des boîtes</mark>
    </h1>
    <p>ici nous allons utiliser la propriété box shadow</p>
    <div class="div1"></div>
    <div class="div2"></div>
    <p>on ajoute inset pour avoir une ombre interieure</p>
    <div class="div3"></div>
</body>
</html>
