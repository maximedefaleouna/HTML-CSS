<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #size{
            font-size: 28px;
        }
        #normal{
            font-style: normal;
        }
        #italic{
            font-style: italic;
        }
        #oblique{
            font-style: oblique;
        }
        #weight{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>
        <mark>les font en css</mark>
    </h1>
    <h2><em>font-size</em></h2>
    <p id="size">taille de police , en px , en % ou en em er rem</p>
    <h2><em>font-style</em></h2>
    <p>permet de forcer le style de notre texte</p>
    <dl>
        <dt>il peut prendre 4 valeure</dt>
        <dd id="normal">normal</dd>
        <dd id="italic">italic</dd>
        <dd id="oblique">oblique</dd>
        <dd>inherit</dd>
    </dl>

    <h2><em>font-weight</em></h2>
    <p id="weight">Pour definir le poids d'une police</p>
</body>
</html>
