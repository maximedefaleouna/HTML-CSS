<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alignement horizontal</title>
  </head>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    h1 {
      background-color: yellow;
      text-align: center;
    }
    .div1 {
      background-color: brown;
      width: 100px;
      height: 100px;
      margin: 15px auto;
    }
    .div2 {
      background-color: black;
      /* width: 100px; */
      height: 100px;
      position: absolute;
      left: 20%;
      right: 20%;
    }
  </style>
  <body>
    <h1>aligner les elements horizontalement</h1>
    <div class="div1"></div>
    <div class="div2"></div>
  </body>
</html>
